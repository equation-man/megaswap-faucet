[package]
name = "megaswap-vault"
version = "0.1.0"
edition = "2024"

[dependencies]
pinocchio = "0.11.2"
pinocchio-associated-token-account = "0.4.0"
pinocchio-log = "0.5.1"
pinocchio-pubkey = "0.3.0"
pinocchio-system = "0.6.1"
pinocchio-token = "0.6.0"
pinocchio-token-2022 = "0.3.1"
solana-account-view = "2.0.0"
solana-address = "2.6.1"

[features]
default = []
std = []
no-entrypoint = []

[lib]
crate-type = ["lib", "cdylib"]

[dev-dependencies]
litesvm = "0.15.0"
litesvm-token = "0.15.0"
solana-keypair = "3.1.2"
solana-program = "4.0.0"
solana-sdk = "4.0.1"
solana-system-interface = "3.2.0"
spl-token = "9.0.0"
