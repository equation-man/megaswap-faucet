[package]
name = "megaswap-faucet"
version = "0.1.0"
edition = "2024"

[dependencies]
pinocchio = "0.11.2"
pinocchio-associated-token-account = "0.4.0"
pinocchio-log = "0.5.1"
pinocchio-pubkey = "0.3.0"
pinocchio-system = "0.6.1"
pinocchio-token = "0.6.0"
pinocchio-token-2022 = "0.3.1"
solana-account-view = "2.0.0"
solana-address = { version = "2.6.1", features = ["curve25519"] }

[features]
default = []
std = []
no-entrypoint = []

[lib]
crate-type = ["lib", "cdylib"]

[dev-dependencies]
litesvm = "0.15.0"
solana-instruction = "3.4.0"
solana-keypair = "3.1.2"
solana-message = "4.4.0"
solana-program = "4.0.0"
solana-pubkey = "4.2.0"
solana-system-interface = "3.2.0"
solana-transaction = "4.1.5"
spl-associated-token-account = "8.0.0"
spl-token = "9.0.0"
